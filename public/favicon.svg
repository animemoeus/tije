<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tjDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- High Contrast Dark Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#tjDark)" />

  <!-- Route Line Curve (Metro/BRT track line) -->
  <path d="M 80 380 C 140 380, 160 260, 240 260 C 320 260, 340 130, 432 130" fill="none" stroke="#334155" stroke-width="28" stroke-linecap="round" />
  <path d="M 80 380 C 140 380, 160 260, 240 260 C 320 260, 340 130, 432 130" fill="none" stroke="url(#orangeGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="24 16" />

  <!-- Route Stops (Halte Dots) -->
  <circle cx="80" cy="380" r="22" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="8" />
  <circle cx="432" cy="130" r="22" fill="#22C55E" stroke="#FFFFFF" stroke-width="8" />

  <!-- Active Moving Bus Icon at Route Center -->
  <g transform="translate(164, 184)">
    <!-- Glow -->
    <rect x="-8" y="-8" width="168" height="168" rx="36" fill="#0EA5E9" opacity="0.3" filter="url(#glow)" />
    <!-- Bus Container -->
    <rect x="0" y="0" width="152" height="152" rx="30" fill="url(#blueGrad)" stroke="#FFFFFF" stroke-width="6" />

    <!-- Windshield -->
    <rect x="18" y="20" width="116" height="52" rx="14" fill="#082F49" />
    <rect x="42" y="28" width="68" height="8" rx="4" fill="#FF9900" />

    <!-- Headlights -->
    <circle cx="36" cy="104" r="12" fill="#FEF08A" />
    <circle cx="116" cy="104" r="12" fill="#FEF08A" />

    <!-- Grill Line -->
    <line x1="56" y1="104" x2="96" y2="104" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
